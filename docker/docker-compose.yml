# fnos-vnts2 一键部署
#
# 【方式一：直接用官方镜像（默认，推荐）】
#   cd docker && docker compose up -d
#   镜像来自 GHCR，多架构（amd64 / arm64 / armv7），打 tag 时自动更新 latest。
#
# 【方式二：本地构建】
#   把 image: 一行注释掉，并把 build: 那两行取消注释，然后：
#   cd docker && docker compose up -d --build
#
# 【固定版本】
#   把 image 的 :latest 换成具体版本，如 :v1.0.0
#
# 端口说明：
#   19098/tcp  管理页（含内嵌控制台）
#   29872/tcp  组网服务 TCP over TLS（客户端连接用）
#   29872/udp  组网服务 QUIC（客户端连接用）
#   29071/tcp  控制台内部端口，仅容器内回环，无需对外映射
#
# 【日志与配置分离 —— 迁移时不带日志】
#   本编排把数据与日志拆成两个卷：
#     vnts-data  -> /data       配置 + 数据库 + 核心   ← 迁移只拷这个
#     vnts-logs  -> /data/log   日志（LOG_DIR 指向它） ← 迁移不需要
#   若不想要独立日志卷，可删掉 LOG_DIR 与 vnts-logs 卷，
#   日志就会落在 /data/log（仍在数据卷内，但依然与配置分离）。

services:
  fnos-vnts2:
    # 默认用官方镜像；想本地构建就注释掉 image、取消下面 build 的注释
    image: ghcr.io/virkingz/fnos-vnts2:latest
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: fnos-vnts2
    restart: unless-stopped

    ports:
      # 管理页。**没有登录页**，鉴权靠入口令牌，访问控制应由外层（反代）承担。
      # ⚠️ 若这台机器有公网 IP 且放行了 19098，别人直连 IP:19098 会绕过反代。
      #    用了反代 + 登录授权的话，建议改成只绑本机：
      #      - "127.0.0.1:19098:19098"
      - "19098:19098"
      # 组网服务：TCP 与 UDP 同号，必须两个都放行，否则客户端打洞失败
      - "29872:29872/tcp"
      - "29872:29872/udp"

    environment:
      TZ: Asia/Shanghai
      # 首次启动自动下载 vnts2 核心
      AUTO_DOWNLOAD_CORE: "1"
      # 日志目录：独立于数据目录。设了它，日志不会落进 /data 顶层
      LOG_DIR: "/data/log"
      # 管理页在容器内的绑定地址。容器内必须 0.0.0.0，
      # 否则端口映射到宿主机后从容器外访问不到。
      # 要限制访问范围请改上面的 ports，不要改这里。
      # PANEL_BIND: "0.0.0.0"

      # 以下均为「按需启用」：留空/注释即不覆盖，沿用管理页里改过的值。
      # PANEL_PORT: "19098"
      # SERVICE_PORT: "29872"
      # PANEL_TOKEN: ""                     # 留空则首次启动自动生成
      # MIRROR: "https://ghfast.top"        # 下载慢就填镜像前缀
      # PROXY: "socks5h://192.168.1.10:1080" # 注意容器内 127.0.0.1 指容器自己

    volumes:
      # 配置 + 数据库 + 核心 —— 迁移只需备份这个卷
      - vnts-data:/data
      # 日志 —— 独立卷，迁移时不带走
      - vnts-logs:/data/log

    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  vnts-data:
  vnts-logs:
