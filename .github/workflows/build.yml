name: build-fpk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 默认收紧；各作业按需提升。
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # 附加 Release 需要写 contents 权限，否则报
    # 「Resource not accessible by integration」(403)。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成图标
        run: python3 scripts/gen_icons.py

      - name: 跑测试
        run: |
          python3 scripts/test_e2e.py
          python3 scripts/test_import_export.py
          python3 scripts/test_console.py
          python3 scripts/test_console_real.py
          python3 scripts/test_concurrency.py

      - name: 校验资源路径改写（用真实 Vite 算法）
        run: node scripts/probe_vite_url.js

      - name: 打包 fpk
        run: bash scripts/pack.sh

      - name: 校验产物
        run: |
          ls -lh fnos-vnts2.fpk
          tar tzf fnos-vnts2.fpk | head -20

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-vnts2-fpk
          path: fnos-vnts2.fpk

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 若该 tag 已有 Release（如手工建过），则复用并只补附件，不重复创建。
          files: fnos-vnts2.fpk
          fail_on_unmatched_files: true
          generate_release_notes: false

  docker:
    # 多架构构建走 QEMU，较慢，因此只在打 tag 或手工触发时执行。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER}/fnos-vnts2"
          # tag 推送：版本号 + latest（latest 始终指向最新版本，供 compose 默认拉取）
          # 其它触发：edge（开发版，不覆盖 latest）
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tags<<EOF"
              echo "${IMG}:${GITHUB_REF_NAME}"
              echo "${IMG}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMG}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # 冒烟测试：只为本机架构单独构建一份（多架构那份推走了、不便直接跑），
      # 然后在容器里实跑 docker/smoke-test.sh。
      #
      # 为什么必须在容器里跑一遍：Dockerfile 删掉了 ensurepip /
      # unittest / multiprocessing 等标准库模块。这类删除在**构建期不会报错**，
      # 风险全在运行时才暴露（某模块被间接 import 才发现缺失）。
      # 本机没有 Docker，因此把这道验证放在 CI 里。
      - name: 为冒烟测试构建本机架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: fnos-vnts2:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 容器冒烟测试（验证精简后的 Python 环境功能完好）
        # 必须用 --entrypoint 覆盖镜像自带的入口：
        # 镜像 ENTRYPOINT 是 `tini -- entrypoint.sh`，而 entrypoint.sh 结尾
        # 是 `wait "$child"`（守护后端，常驻不退），且**不转发 "$@"** ——
        # 直接 `docker run 镜像 sh /t/smoke-test.sh` 的话，我们传的命令会被
        # 完全忽略，容器只会跑起后端并一直挂着，CI 便卡在那里直到超时。
        # 加 timeout 兜底：万一脚本自身卡住，也不要拖满 6 小时配额。
        run: |
          timeout 180 docker run --rm \
            --entrypoint sh \
            -v "$PWD/docker:/t:ro" \
            fnos-vnts2:smoke \
            /t/smoke-test.sh
